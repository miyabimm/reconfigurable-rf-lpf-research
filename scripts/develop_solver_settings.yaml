# Plan input generation only; not a Runner config or automatic preset loader.
# Exploration: adopted from #531/#535. Exploitation: provisional, #539 comparison pending.
# Refinement: #533 (70-point evidence); high-density application pending.
exploration:
  solver: trf
  objective: signed_margin_db
  aggregation: sum
  options:
    ftol: 1.0e-6
    x_scale: 1.0
    restart_sigma: 0.1
    restart_center: last

exploitation:
  solver: trf
  objective: signed_margin_db
  aggregation: sum
  options:
    ftol: 1.0e-6
    x_scale: 1.0
    restart_sigma: 0.1
    restart_center: best

refinement:
  solver: trf
  objective: signed_margin_db
  aggregation: sum
  options:
    ftol: 1.0e-8
    x_scale: jac
    restart_sigma: null
