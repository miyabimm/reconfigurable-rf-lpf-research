name: EXP-066 RF-T005 4L1GJM Phase2 wide topology search
on:
  pull_request:
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-066/**'
      - '.github/workflows/exp066_rft005_4l1c_wide.yml'
  workflow_dispatch:
    inputs:
      run_optimization:
        description: 'Run sharded SLSQP after structural RF screening'
        type: boolean
        default: true
      candidates_per_shard:
        description: 'Number of screened topologies per shard'
        type: choice
        options: ['2', '4', '6']
        default: '2'
permissions:
  contents: read
concurrency:
  group: exp066-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm EXP-066 main reservation (Phase2 RF-T005)
        run: |
          git fetch origin main:refs/remotes/origin/main
          python scripts/experiment_id_registry.py --experiment-id EXP-066 --owner MasayaTakagi
      - name: 4L structural census
        run: |
          python -m py_compile experiments/chatgpt_topology_search/runs/EXP-066/wide_search.py
          python experiments/chatgpt_topology_search/runs/EXP-066/wide_search.py \
            --phase census --out results/EXP-066/census.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp066-structural-census
          path: results/EXP-066/census.json
          if-no-files-found: error
          retention-days: 30
  screen:
    needs: census
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Phase2 provenance and Git-only preflight
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-066 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py preflight EXP-066
      - name: Screen spanning trees, fixed C, PCB C, DTC and physical rows
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-066/wide_search.py \
            --phase screen --limit 24 --out results/EXP-066/screen.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp066-screen-finite-grid
          path: results/EXP-066/screen.json
          if-no-files-found: warn
          retention-days: 30
  optimize:
    needs: screen
    if: github.event_name == 'pull_request' || inputs.run_optimization == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Resolve dependencies
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: exp066-screen-finite-grid
          path: results/EXP-066
      - name: Staged SLSQP v2 per screened topology
        env:
          ITEMS_PER_SHARD: ${{ inputs.candidates_per_shard || '2' }}
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-066/wide_search.py \
            --phase optimize --input results/EXP-066/screen.json \
            --limit "$ITEMS_PER_SHARD" --shard ${{ matrix.shard }} --shards 4 \
            --out results/EXP-066/optimize_shard${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp066-optimizer-shard-${{ matrix.shard }}
          path: results/EXP-066/optimize_shard${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30
