name: EXP-049 RF-T006 area step-up (temporary runner)
on:
  push:
    branches:
      - experiment/exp049-t006-area-stepup-1p1db
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-049/optimize.py'
      - '.github/workflows/exp049_t006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      EXP049_MAX_SECONDS: "540"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Check central EXP-049 reservation and frozen RF trial
        run: |
          python scripts/experiment_id_registry.py --experiment-id EXP-049 --owner MasayaTakagi
          python -c "from src.lpf.constraint_versions import load_constraint; p=load_constraint('RF-T006',allow_trial=True); assert p['trial_base_constraint_id']=='RF-F003' and p['components']['IC_VARIABLE_C']['max_branches_principle']==2"
      - name: Run area-escalating RF-T006 numerical optimization
        run: python -u experiments/chatgpt_topology_search/runs/EXP-049/optimize.py
      - name: Persist selected per-area checkpoints and provenance
        run: |
          set -euo pipefail
          cp results/EXP-049/selected.json experiments/chatgpt_topology_search/runs/EXP-049/selected.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from src.lpf.experiment_manifest import new_manifest,validate_manifest,write_manifest
          root=Path.cwd()
          run=root/'experiments/chatgpt_topology_search/runs/EXP-049'
          selected=run/'selected.json'
          result=json.loads(selected.read_text('utf-8'))
          m=new_manifest('EXP-049','RF-T006 stepped chip-area 4L-6L topology search targeting worst UL/DL IL<=1.1dB',
              {'source':'EXP-048 selected','source_sha256':result['origin_EXP048_selected_sha256'],
               'areas':result['explored_area_levels'],'templates':result['searched_topology_templates'],
               'completed_starts':result['completed_starts'],
               'metrics':'worst IL, H2 >=30dB, H3 >=30dB, 3-6GHz >=20dB',
               'screen_band_points':4,'screen_wide_step_MHz':150,
               'full_band_points':1001,'full_wide_step_MHz':1},
              objective='full_lpf',seed=result['seed'],root=root,
              constraint_id='RF-T006',allow_trial=True)
          m['code']['execution_sha']=os.environ['GITHUB_SHA']
          m['code']['working_tree_dirty']=False
          m['execution']={'status':'completed','elapsed_seconds':result['elapsed_seconds'],
                          'evaluation_count':result['evaluations']}
          passed=(result['best_full_grid'] is not None and
                  result['best_full_grid']['mandatory_pass_full_grid'])
          m['validation']={
              'numerical':'passed' if passed else 'failed',
              'independent':'passed' if (result['independent_MNA'] and result['independent_MNA']['passed']) else 'not_run',
              'implementation':'not_run',
              'analysis_grid':result['verification'],
              'independent_grid':result['independent_MNA']}
          relative='experiments/chatgpt_topology_search/runs/EXP-049/selected.json'
          m['evidence']=[{'path':relative,'sha256':hashlib.sha256(selected.read_bytes()).hexdigest()}]
          m['limitations']=result['limitations']+[
              'Max IL 1.1 dB is an engineering objective, not a formal RF-F003 replacement.',
              'Optimizer terminations and finite-grid evidence do not prove physical component feasibility.']
          validate_manifest(m,root=root)
          write_manifest(run/'manifest.json',m,root=root)
          print('manifest committed evidence SHA',m['evidence'][0]['sha256'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/chatgpt_topology_search/runs/EXP-049/selected.json experiments/chatgpt_topology_search/runs/EXP-049/manifest.json
          git commit -m "results(EXP-049): retain area Pareto candidates with full-grid and independent evidence"
          git push origin HEAD:refs/heads/experiment/exp049-t006-area-stepup-1p1db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXP-049-selected
          path: results/EXP-049/selected.json
          retention-days: 14
          if-no-files-found: warn
