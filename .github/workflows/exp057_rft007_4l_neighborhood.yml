name: EXP-057 RF-T007 4L neighborhood from EXP-055 best

on:
  pull_request:
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-057/**'
      - 'tests/test_exp057_graph_neighbors.py'
      - '.github/workflows/exp057_rft007_4l_neighborhood.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp057-neighborhood:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify main experiment reservation and completed Git evidence audit
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-057 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py audit
      - name: Verify frozen EXP-055 reference and ten distinct tree graphs
        run: uv run --frozen python -m unittest discover -s tests -p 'test_exp057_graph_neighbors.py' -v
      - name: Run ten 4L topology optimizations on manual dispatch only after original run
        if: github.event_name == 'workflow_dispatch'
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-057/sweep_from_exp055.py \
            --starts 2 --coarse 7 --fine 17 --dense 1001 --mna 3 --target 30.005 \
            --out results/EXP-057/exp055_fourl_neighborhood.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: exp057-rft007-fourl-neighborhood
          path: results/EXP-057/exp055_fourl_neighborhood.json
          if-no-files-found: warn
          retention-days: 30
