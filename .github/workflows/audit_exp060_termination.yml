name: Audit EXP-060 SLSQP termination causes
on:
  pull_request:
    paths:
      - 'scripts/audit_exp060_slsqp_termination.py'
      - '.github/workflows/audit_exp060_termination.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve immutable EXP-060 raw numerical results
        uses: actions/download-artifact@v4
        with:
          run-id: 39434590336
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: exp060-*
          merge-multiple: true
          path: downloaded/EXP-060
      - name: Summarize 126 real termination reasons
        shell: bash
        run: |
          python scripts/audit_exp060_slsqp_termination.py \
            --folder downloaded/EXP-060 \
            --out downloaded/diagnosis_exp060.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp060-126-attempt-termination-diagnosis
          path: downloaded/diagnosis_exp060.json
          retention-days: 30
          if-no-files-found: warn
