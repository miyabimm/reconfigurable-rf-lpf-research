name: EXP-062 RF-T008 Phase2 high-cost grounded PCB transfer
on:
  push:
    branches:
      - exp062-rft008-grounded-pcb-higher-cost-20261020
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-062/**'
      - '.github/workflows/exp062_rft008_4l_high_cost_pcb.yml'
      - 'data/experiment_index.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first_wave:
    name: 4L GJM PCB-C ${{ matrix.layout }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        layout: [a533_control, a533_ground2, a533_ground_alt, a533_ground_one, a6_control, a6_grounded, a6_ground_swap, a6_ground_swap2, a667_control, a667_ground3, a667_ground_alt, a667_ground_swap]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Independent main reservation and pre-run evidence gates
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-062 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py preflight EXP-062
          uv run --frozen python -m py_compile experiments/chatgpt_topology_search/runs/EXP-062/search_grounded_transfer_4l.py
      - name: Perform RF-T008 optimization and independent 9x9 MNA
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-062/search_grounded_transfer_4l.py \
            --layout "${{ matrix.layout }}" --starts 2 --coarse 7 --fine 17 \
            --dense 1001 --target 30.005 \
            --out "results/EXP-062/${{ matrix.layout }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp062-${{ matrix.layout }}
          path: results/EXP-062/${{ matrix.layout }}.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: [first_wave]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exp062-*
          merge-multiple: true
          path: results/EXP-062/collected
      - name: Aggregate completed results and report new candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("results/EXP-062/collected").glob("a*.json"))
          rows=[]
          for file in files:
              d=json.loads(file.read_text())
              good=d.get("best_converged_30db")
              rows.append({
                "layout":d["layout"], "area":d["chip_area"],
                "GJM_edges":d["GJM_edges"], "PCB_edges":d["PCB_edges"],
                "IL_db":good["dense"]["worst_IL_db"] if good else None,
                "H2_db":good["dense"]["min_H2_db"] if good else None,
                "H3_db":good["dense"]["min_H3_db"] if good else None,
                "MNA_pass": d["independent_MNA"]["pass"] if good else None,
                "converged_eligible_starts":sum(any(z["eligible"] for z in r["attempts"]) for r in d["starts"]),
                "attempted":len(d["starts"]), "execution_sha":d["code_execution_sha"]
              })
          ordered=sorted(rows,key=lambda a:(a["area"],a["IL_db"] if a["IL_db"] is not None else 1e99))
          summary={"experiment_id":"EXP-062","status":"executed" if len(files)==12 else "partial",
                   "completed_layouts":len(files),"planned_layouts":12,"rows":ordered}
          dest=Path("results/EXP-062/summary.json")
          dest.write_text(json.dumps(summary,indent=2)+"\n")
          for r in ordered:
              print("PARETO_CANDIDATE",r["layout"],"area",r["area"],"IL",r["IL_db"],
                    "H2",r["H2_db"],"H3",r["H3_db"],"MNA",r["MNA_pass"])
          print("EXP062_COMPLETED",len(files),"EXPECTED",12)
          if len(files)!=12: raise SystemExit("Partial batch; do not claim completed")
          if any(q["IL_db"] is not None and q["MNA_pass"] is not True for q in rows):
              raise SystemExit("MNA discrepancy; do not update Pareto")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp062-aggregate-summary
          path: results/EXP-062/summary.json
          if-no-files-found: warn
          retention-days: 30
