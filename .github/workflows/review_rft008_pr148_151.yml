name: Independent PR148-151 RF-T008 v3 evidence review
on:
  push:
    branches:
      - exp065-rft008-wide-4l2gjm-20261020
    paths:
      - '.github/workflows/review_rft008_pr148_151.yml'
      - 'scripts/review_rft008_exp062_065.py'
      - 'data/pareto_snapshots/rf_t008_exp062_065_integrated_20261020.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install frozen numerical review dependencies
        run: uv sync --frozen
      - name: Independently audit 10 retained circuit checkpoints and 4 summaries
        run: uv run --frozen python scripts/review_rft008_exp062_065.py
      - name: Inspect Git-storage audit without mutating experiment records
        run: uv run --frozen python scripts/audit_new_experiment_storage.py audit
