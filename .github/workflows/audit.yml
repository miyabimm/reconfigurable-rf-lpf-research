name: Phase 2 smoke (lightweight)

# Code and research-data changes only. Docs-only edits do not run routine CI.
# Deep historical audits and dense RF numerical checks are run manually as needed.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'candidates/**'
      - 'experiments/**'
      - 'actions/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'candidates/**'
      - 'experiments/**'
      - 'actions/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'uv.lock'
  workflow_dispatch:

concurrency:
  group: phase2-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # EXP-048+ provenance must check the actual origin/main reservation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check current RF constraints, RF model, six settings and candidate sources
        run: |
          set -euo pipefail
          for test_file in \
            test_circuit.py \
            test_evaluate.py \
            test_rf_f003_t005.py \
            test_phase2_candidate_catalog.py \
            test_exp047_legacy_manifest_adapter.py \
            test_github_actions_yaml_keys.py; do
            echo "Running smoke module: $test_file"
            python -m unittest discover -s tests -p "$test_file" -v
          done

      - name: Verify future EXP storage policy (read only)
        run: python scripts/audit_new_experiment_storage.py audit
      - name: Run 12 storage gate tests only when storage governance changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            compare_base="$(git merge-base origin/main HEAD)"
          else
            compare_base="$(git rev-parse HEAD^)"
          fi
          if git diff --name-only "$compare_base" HEAD | grep -Eq '^(scripts/audit_new_experiment_storage\.py|tests/test_new_experiment_storage\.py|\.github/workflows/audit\.yml); then
            python -m unittest discover -s tests -p test_new_experiment_storage.py -v
          else
            echo "No storage gate changes; retain lightweight 24-test daily smoke."
          fi
