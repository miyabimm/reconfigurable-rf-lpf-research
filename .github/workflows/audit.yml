name: Phase 2 smoke (lightweight)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the complete routine regression suite'
        type: boolean
        default: true
      integration:
        description: 'Also run full shared-entry, continuation, synthetic-runner and topology integration suites'
        type: boolean
        default: false

concurrency:
  group: phase2-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out HEAD
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify future EXP storage policy (read only)
        run: python scripts/audit_new_experiment_storage.py audit
      - name: Check classifier fail-closed behavior
        run: python -m unittest discover -s tests -p test_storage_ci_classification.py -v
      - name: Check experiment reservation and provenance
        run: |
          set -euo pipefail
          for test_file in test_experiment_number_reservation.py test_experiment_provenance.py test_new_experiment_storage.py; do
            python -m unittest discover -s tests -p "$test_file" -v
          done
      - name: Classify complete event diff and run selected tests
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_REF: ${{ github.ref }}
          CI_FULL: ${{ inputs.full }}
        run: python scripts/select_ci_tests.py
      - name: Full runner and topology integration (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.integration }}
        run: |
          set -euo pipefail
          for test_file in test_phase2_shared_entry.py test_phase2_continuation_integration.py test_phase2_synthetic_runner.py test_phase2_topology_enumeration.py; do
            python -m unittest discover -s tests -p "$test_file" -v
          done
