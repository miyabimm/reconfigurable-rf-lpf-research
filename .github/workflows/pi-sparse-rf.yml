name: Pi sparse RF smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the complete sparse regression suite'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sparse-rf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # checkout automatically applies blob:none for sparse-checkout.
          sparse-checkout: |
            project
            rf
            src
            scripts
            tests
            .github
      - name: Verify exact checked-out HEAD
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Assert historical directories are absent
        shell: bash
        run: |
          set -euo pipefail
          for d in docs data experiments; do
            if test -e "$d"; then
              echo "Unexpected Pi sparse path: $d" >&2
              exit 1
            fi
          done
          test -f rf/constraints/registry.json
          test -f rf/bands.csv
          test -f rf/parasitics/circuit1_ant_coupler_0_6ghz.s2p
          test -f rf/parasitics/circuit2_poc_through_0_6ghz.s2p
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Classify complete event diff and run sparse tests
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_REF: ${{ github.ref }}
          CI_FULL: ${{ inputs.full }}
        run: uv run --frozen python scripts/select_ci_tests.py --sparse
