name: EXP-049 Q33 supplier-range constrained search (temporary)
on:
  push:
    branches:
      - experiment/exp049-t006-area-stepup-1p1db
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-049/physical_q33.py'
      - '.github/workflows/exp049_q33_physical.yml'

permissions:
  contents: write

jobs:
  phase2_search:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      EXP049_PHYSICAL_MAX_SECONDS: "395"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Verify EXP-049 main reservation and unchanged trial
        run: |
          python scripts/experiment_id_registry.py --experiment-id EXP-049 --owner MasayaTakagi
          python -c "from src.lpf.constraint_versions import load_constraint; x=load_constraint('RF-T006',allow_trial=True); assert x['trial_base_constraint_id']=='RF-F003'"
      - name: Search Q33 with supplier nominal range gate
        run: python -u experiments/chatgpt_topology_search/runs/EXP-049/physical_q33.py
      - name: Store vetted nominal-range-selected evidence without old checkpoint overwrite
        run: |
          set -euo pipefail
          cp results/EXP-049/physical_q33.json experiments/chatgpt_topology_search/runs/EXP-049/physical_q33.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/chatgpt_topology_search/runs/EXP-049/physical_q33.json
          git commit -m "results(EXP-049): archive supplier-range-gated Q33 topology search"
          git push origin HEAD:refs/heads/experiment/exp049-t006-area-stepup-1p1db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXP-049-Q33-nominal-range
          path: results/EXP-049/physical_q33.json
          retention-days: 14
          if-no-files-found: warn
