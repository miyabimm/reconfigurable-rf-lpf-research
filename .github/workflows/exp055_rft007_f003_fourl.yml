name: EXP-055 RF-T007 adaptation from F003 four-L two-DTC topology

on:
  pull_request:
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-055/**'
      - 'tests/test_exp055_f003_adapt.py'
      - '.github/workflows/exp055_rft007_f003_fourl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp055-f003-rft007:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify EXP-055 main reservation and finalized Git evidence audit
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-055 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py audit
      - name: Check F003 reproduction and distinct T007 fixed shunt parasitic
        run: uv run --frozen python -m unittest discover -s tests -p 'test_exp055_f003_adapt.py' -v
      - name: Rerun RF-T007 four-L topology search on manual dispatch only
        if: github.event_name == 'workflow_dispatch'
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-055/adapt_f003_4l.py \
            --starts 3 --maxiter 160 --coarse 7 --fine 17 \
            --dense 1001 --mna 3 --target 30.005 \
            --out results/EXP-055/f003_fourL_adapt.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: exp055-rft007-f003-fourl-adaptation
          path: results/EXP-055/f003_fourL_adapt.json
          if-no-files-found: warn
          retention-days: 30
