name: EXP-049 T006 Q33 topology tuning (temporary)
on:
  push:
    branches:
      - experiment/exp049-t006-area-stepup-1p1db
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-049/target_1p1.py'
      - '.github/workflows/exp049_target_t006.yml'

permissions:
  contents: write

jobs:
  phase2_tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      EXP049_TARGET_MAX_SECONDS: "400"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Verify original main EXP-049 reservation and RF-T006 scope
        run: |
          python scripts/experiment_id_registry.py --experiment-id EXP-049 --owner MasayaTakagi
          python -c "from src.lpf.constraint_versions import load_constraint; p=load_constraint('RF-T006',allow_trial=True); assert p['trial_base_constraint_id']=='RF-F003'"
      - name: Execute Q33 1.1dB focused tuning
        run: python -u experiments/chatgpt_topology_search/runs/EXP-049/target_1p1.py
      - name: Retain reproducible selected candidates only
        run: |
          set -euo pipefail
          cp results/EXP-049/target_1p1.json experiments/chatgpt_topology_search/runs/EXP-049/target_1p1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/chatgpt_topology_search/runs/EXP-049/target_1p1.json
          git commit -m "results(EXP-049): archive T006 high-Q component topology 1.1dB attempt"
          git push origin HEAD:refs/heads/experiment/exp049-t006-area-stepup-1p1db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXP-049-T006-Q33-candidates
          path: results/EXP-049/target_1p1.json
          retention-days: 14
          if-no-files-found: warn
