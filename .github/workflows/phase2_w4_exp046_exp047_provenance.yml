name: Phase 2 W4 EXP-046 and EXP-047 evidence provenance

on:
  pull_request:
    paths:
      - 'scripts/audit_w4_exp046_exp047_sources.py'
      - '.github/workflows/phase2_w4_exp046_exp047_provenance.yml'
      - 'data/repository_reviews/w4_exp046_exp047_*_20261018.*'
      - 'docs/phase2_w4_exp046_exp047_source_review_20261018.md'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect original EXP-046 and EXP-047 blobs, corrections and RF condition separation
        run: |
          python3 scripts/audit_w4_exp046_exp047_sources.py \
            --output-dir artifacts/phase2_reports/w4/exp046_047 \
            --emit-csv-chunks
      - name: Verify pinned source-by-source results after initial discovery
        run: |
          if test -f data/repository_reviews/w4_exp046_exp047_131_20261018.csv; then
            cmp artifacts/phase2_reports/w4/exp046_047/w4_exp046_exp047_131_provenance.csv \
              data/repository_reviews/w4_exp046_exp047_131_20261018.csv
            python3 - <<'PY'
          import json
          from pathlib import Path
          exp = json.loads(Path('data/repository_reviews/w4_exp046_exp047_summary_20261018.json').read_text())
          actual = json.loads(Path('artifacts/phase2_reports/w4/exp046_047/w4_exp046_exp047_provenance_summary.json').read_text())
          for k in ('source_total','by_experiment','by_kind','verified_original_blob_count',
                    'protected_other_46_sha_match','exp046','exp047',
                    'original_experiment_deletions','new_optimizer_runs','new_independent_MNA_runs',
                    'w4_evidence_removal_authorized'):
              assert exp[k] == actual[k],k
          assert exp['source_total']==131
          print('W4 frozen EXP-046/047 131-source review matches current original bytes and correction classification')
          PY
          else
            echo 'INITIAL CI REVIEW: source CSV and summary pending Git commit.'
          fi
      - name: Validate other W4 source retention and historical links
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-w4-exp046-exp047-provenance-inventory
          path: artifacts/phase2_reports/w4/exp046_047/
          if-no-files-found: warn
          retention-days: 30
