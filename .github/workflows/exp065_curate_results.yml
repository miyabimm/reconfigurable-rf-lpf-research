name: EXP-065 Git-only RF-T008 verified topology curation
on:
  push:
    branches:
      - exp065-rft008-wide-4l2gjm-20261020
    paths:
      - '.github/workflows/exp065_curate_results.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  curate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Detect retained EXP-065 evidence state
        id: evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("experiments/chatgpt_topology_search/runs/EXP-065/storage_record.json")
          d=json.loads(p.read_text()) if p.exists() else {}
          complete=d.get("stage")=="complete" and d.get("git_readback")=="passed"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("complete="+str(complete).lower()+"\n")
          print("EXISTING_CURATED_EXP065",complete)
          PY
      - name: Verify current main EXP-065 reservation and unfinished manifest
        if: steps.evidence.outputs.complete != 'true'
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-065 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py preflight EXP-065
      - uses: actions/download-artifact@v4
        if: steps.evidence.outputs.complete != 'true'
        with:
          run-id: 39453297733
          github-token: ${{ github.token }}
          pattern: exp065-*-*-*
          merge-multiple: true
          path: results/EXP-065/collected
      - name: Curate 96 circuit outcomes, 192 statuses and 4 validated full checkpoints
        if: steps.evidence.outputs.complete != 'true'
        run: |
          uv run --frozen python scripts/curate_exp065.py --input results/EXP-065/collected
          git diff --stat
      - name: Commit curated evidence and audit before branch push
        if: steps.evidence.outputs.complete != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/chatgpt_topology_search/runs/EXP-065/ \
                  data/experiment_index.csv \
                  data/pareto_snapshots/rf_t008_exp065_4l2gjm_wide_20261020.json
          git commit -m "EXP-065: curate 96 topology cases and new 4L2GJM validated IL [skip ci]"
          uv run --frozen python scripts/audit_new_experiment_storage.py finalize EXP-065
          uv run --frozen python scripts/audit_new_experiment_storage.py audit
          git push origin HEAD:exp065-rft008-wide-4l2gjm-20261020
      - name: Audit complete EXP-065 evidence on idempotent rerun
        if: steps.evidence.outputs.complete == 'true'
        run: |
          python scripts/audit_new_experiment_storage.py audit
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("experiments/chatgpt_topology_search/runs/EXP-065")
          x=json.loads((r/"run_summary.json").read_text())
          m=json.loads((r/"manifest.json").read_text())
          assert x["attempts"]=={"planned":192,"attempted":192,"converged":178,
              "nonconverged":14,"failed":0,"not_started":0}
          assert x["eligible_layout_count"]==93
          assert x["best_found_IL_db"]<x["prior_EXP062_best_IL_db"]
          assert m["validation"]["independent"]=="passed"
          print("EXP065_IDEMPOTENT_GIT_REVIEW",x["best_found_IL_db"])
          PY
