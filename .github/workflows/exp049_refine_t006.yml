name: EXP-049 T006 SLSQP refinement (temporary)
on:
  push:
    branches:
      - experiment/exp049-t006-area-stepup-1p1db
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-049/refine.py'
      - '.github/workflows/exp049_refine_t006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      EXP049_REFINE_MAX_SECONDS: "480"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Reverify reserved EXP-049 and trial T006
        run: |
          python scripts/experiment_id_registry.py --experiment-id EXP-049 --owner MasayaTakagi
          python -c "from src.lpf.constraint_versions import load_constraint; p=load_constraint('RF-T006',allow_trial=True); assert p['trial_base_constraint_id']=='RF-F003'"
      - name: Optimize larger chip areas and independently verify best
        run: python -u experiments/chatgpt_topology_search/runs/EXP-049/refine.py
      - name: Preserve non-overwriting continuation evidence
        run: |
          set -euo pipefail
          cp results/EXP-049/continuation.json experiments/chatgpt_topology_search/runs/EXP-049/continuation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/chatgpt_topology_search/runs/EXP-049/continuation.json
          git commit -m "results(EXP-049): retain additional-area bounded constrained refinement and independent validation"
          git push origin HEAD:refs/heads/experiment/exp049-t006-area-stepup-1p1db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXP-049-refinement
          path: results/EXP-049/continuation.json
          retention-days: 14
          if-no-files-found: warn
