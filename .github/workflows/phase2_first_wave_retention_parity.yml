name: Phase 2 first-wave retention parity (non-destructive)

on:
  pull_request:
    paths:
      - '.github/workflows/phase2_first_wave_retention_parity.yml'
      - '.github/workflows/phase2_cleanup_w2.yml'
      - '.github/workflows/phase2_cleanup_w3.yml'
      - '.github/workflows/phase2_w4_exp042_crosswalk.yml'
      - '.github/workflows/phase2_w4_exp042_missing_variants.yml'
      - '.github/workflows/phase2_w4_exp046_exp047_provenance.yml'
      - 'scripts/**'
      - 'tests/test_phase2_topology_search.py'
      - 'data/catalog/**'
      - 'data/repository_reviews/**'
      - 'data/pareto_snapshots/**'
      - 'experiments/chatgpt_topology_search/runs/EXP-042/**'
      - 'experiments/chatgpt_topology_search/runs/EXP-046/**'
      - 'experiments/chatgpt_topology_search/runs/EXP-047/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Temporary replacement-candidate gate. All five historical workflows stay intact.
# A successful run establishes retained checks on this commit, NOT owner approval
# to retire any workflow and NOT numerical RF revalidation.
jobs:
  w2-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve W2 source-pinned structural unit tests
        run: python3 -m unittest tests.test_phase2_topology_search -v
      - name: Preserve byte-identical W2 CSV, JSON and Markdown
        run: python3 scripts/build_phase2_topology_search.py --check

  w3-source-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve W3 four approved removals, git-show recovery and 46 originals
        run: python3 scripts/verify_phase2_cleanup_w3.py
      - name: Preserve W1 tracked Markdown link checks
        run: python3 scripts/verify_phase2_cleanup_w1_links.py

  exp042-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute original ZIP to checkpoint records
        run: python3 scripts/audit_w4_exp042_artifact_checkpoint_crosswalk.py --output-dir artifacts/phase2_reports/w4/crosswalk
      - name: Require byte-exact pinned 19-member CSV and full JSON snapshot
        run: |
          cmp artifacts/phase2_reports/w4/crosswalk/exp042_zip_member_to_git_crosswalk.csv data/repository_reviews/w4_exp042_member_crosswalk_20261018.csv
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('data/repository_reviews/w4_exp042_crosswalk_summary_20261018.json').read_text())
          actual = json.loads(Path('artifacts/phase2_reports/w4/crosswalk/exp042_crosswalk_summary.json').read_text())
          assert actual == expected, 'Historical crosswalk summary differs'
          assert actual['original_zip_count'] == 10 and actual['member_count'] == 19
          assert actual['files_deleted'] == 0 and actual['rf_optimization_runs'] == 0
          print('W4 crosswalk pinned 10 ZIP / 19 member PASS')
          PY
      - name: Independently recheck ten ZIP SHA and member CRC offline
        run: python3 scripts/preserve_exp042_actions_artifacts.py --verify-repository
      - name: Preserve tracked documentation links
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-wave-exp042-crosswalk
          path: artifacts/phase2_reports/w4/crosswalk/
          if-no-files-found: warn
          retention-days: 30

  exp042-six-original-members:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify six original JSON bytes and historical variant report
        run: |
          python3 scripts/audit_w4_exp042_missing_variants.py --output-dir artifacts/phase2_reports/w4/missing_variants --verify-committed-recovery
      - name: Preserve original ten ZIP SHA and CRC
        run: python3 scripts/preserve_exp042_actions_artifacts.py --verify-repository
      - name: Preserve tracked documentation links
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-wave-exp042-six-original-members
          path: artifacts/phase2_reports/w4/missing_variants/
          if-no-files-found: warn
          retention-days: 30

  exp046-exp047-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute original EXP-046 and EXP-047 provenance inventory
        run: python3 scripts/audit_w4_exp046_exp047_sources.py --output-dir artifacts/phase2_reports/w4/exp046_047
      - name: Require pinned 131-source CSV and correction lineage
        run: |
          cmp artifacts/phase2_reports/w4/exp046_047/w4_exp046_exp047_131_provenance.csv data/repository_reviews/w4_exp046_exp047_131_20261018.csv
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('data/repository_reviews/w4_exp046_exp047_summary_20261018.json').read_text())
          actual = json.loads(Path('artifacts/phase2_reports/w4/exp046_047/w4_exp046_exp047_provenance_summary.json').read_text())
          for key in ('source_total','by_experiment','by_kind','verified_original_blob_count',
                      'protected_other_46_sha_match','exp046','exp047',
                      'original_experiment_deletions','new_optimizer_runs','new_independent_MNA_runs',
                      'w4_evidence_removal_authorized'):
              assert expected[key] == actual[key], key
          assert actual['source_total'] == 131
          assert actual['w4_evidence_removal_authorized'] is False
          print('EXP-046/047 pinned 131 original SHA / correction lineage PASS')
          PY
      - name: Preserve tracked documentation links
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-wave-exp046-exp047-provenance
          path: artifacts/phase2_reports/w4/exp046_047/
          if-no-files-found: warn
          retention-days: 30
