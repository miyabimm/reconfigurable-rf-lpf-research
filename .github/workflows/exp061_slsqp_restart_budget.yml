name: EXP-061 RF-T008 restart budget diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        bucket: [0, 1, 2, 3]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify main EXP-061 reservation and Phase 2 evidence policy
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-061 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py preflight EXP-061
      - name: Retrieve all EXP-060 immutable starting checkpoints
        uses: actions/download-artifact@v4
        with:
          run-id: 39434590336
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: exp060-*
          merge-multiple: true
          path: results/EXP-060/collected
      - name: Paired same-initial-vector budget comparison with full solver flags
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-061/benchmark_restart.py \
            --bucket ${{ matrix.bucket }} --buckets 4 \
            --out results/EXP-061/bucket_${{ matrix.bucket }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp061-bucket-${{ matrix.bucket }}
          path: results/EXP-061/bucket_${{ matrix.bucket }}.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: [compare]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exp061-bucket-*
          merge-multiple: true
          path: out
      - name: Rank paired outcome, solver stopping reason and iterate count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,statistics
          files=sorted(Path("out").glob("bucket_*.json"))
          rows=[case for f in files for case in json.loads(f.read_text())["cases"]]
          arms=["same_budget","raised_budget"]
          if len(rows)!=20:raise SystemExit("Expected 20 matched source failures")
          out={"experiment_id":"EXP-061","source_run_id":39434590336,
               "matched_fine_success_coarse_failure_cases":20,
               "comparison":"identical warm start final vector; 240/120 vs 500/280",
               "cases":rows,"results":{}}
          for arm in arms:
              qs=[x["arms"][arm] for x in rows]
              conv=sum(q["solver"]["full_convergence"] for q in qs)
              both=sum(q["converged_and_30dB"] for q in qs)
              mna=sum(bool(q["independent_MNA"] and q["independent_MNA"]["pass"]) for q in qs)
              maxci=max(q["solver"]["coarse"]["nit"] for q in qs)
              maxfi=max(q["solver"]["fine"]["nit"] for q in qs)
              nfev=sum(q["solver"][s]["nfev"] for q in qs for s in ["coarse","fine"])
              out["results"][arm]={"converged_both":conv,
                    "converged_and_30dB":both,"independent_MNA_pass":mna,
                    "coarse_max_nit":maxci,"fine_max_nit":maxfi,
                    "total_function_calls":nfev}
              print("RESULT",arm,json.dumps(out["results"][arm]))
          path=Path("paired_slsqp_benchmark.json")
          path.write_text(json.dumps(out,indent=2,ensure_ascii=False)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp061-paired-budget-summary
          path: paired_slsqp_benchmark.json
          if-no-files-found: warn
          retention-days: 30
