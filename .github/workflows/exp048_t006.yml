name: EXP-048 T006 optimization (temporary research runner)
on:
  push:
    branches:
      - experiment/exp048-rft006-4l2cv-a5p333
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-048/optimize.py'
      - '.github/workflows/exp048_t006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase2_optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Preflight EXP-048 reservation and trial identity
        run: |
          python scripts/experiment_id_registry.py --experiment-id EXP-048 --owner MasayaTakagi
          python -c "from src.lpf.constraint_versions import load_constraint; x=load_constraint('RF-T006',allow_trial=True); assert x['trial_base_constraint_id']=='RF-F003'; assert x['components']['IC_VARIABLE_C']['max_branches_principle']==2"
      - name: Execute EXP-048 RF-T006 bounded optimization
        run: python -u experiments/chatgpt_topology_search/runs/EXP-048/optimize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXP-048-selected
          path: results/EXP-048/selected.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve complete selected numerical checkpoint as Git evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp results/EXP-048/selected.json experiments/chatgpt_topology_search/runs/EXP-048/selected.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from src.lpf.experiment_manifest import new_manifest, validate_manifest, write_manifest
          root=Path.cwd()
          dir=root/"experiments/chatgpt_topology_search/runs/EXP-048"
          selected=dir/"selected.json"
          r=json.loads(selected.read_text("utf-8"))
          manifest=new_manifest(
              "EXP-048",
              "RF-T006 3-6GHz ≥20dB mandatory full-LPF local optimization of EXP-047 area 5⅓ 4L 2-Cv seed",
              {"starting_checkpoint":"EXP-047/area5p333_g2_independent_28x1001_20261017.json",
               "source_sha256":r["source_sha256"],
               "chip_area_units":5.333333333333333,
               "component_counts":r["component_counts"],
               "scope":"Same-count 4L LQP02HV, two GJM01, two PCB-C, two IC-Cv; component retune and six predefined capacitor placements",
               "seed":r["seed"],"replayed_prior_run_id":39134476056,
               "pass_harmonic_points_per_segment":1001,
               "new_stopband_points_per_setting":3001},
              objective="full_lpf",seed=r["seed"],root=root,
              constraint_id="RF-T006",allow_trial=True)
          manifest["code"]["execution_sha"]=os.environ["GITHUB_SHA"]
          # Working tree was clean at start of the Actions optimization; it is dirty
          # only now because selected output has been copied for preservation.
          manifest["code"]["working_tree_dirty"]=False
          manifest["execution"]={"status":"completed","elapsed_seconds":r["elapsed_seconds"],
                                 "evaluation_count":r["objective_calls"]}
          manifest["validation"]={
              "numerical":"passed" if r["selected"]["finite_grid_mandatory_pass"] else "failed",
              "independent":"passed" if r["independent_validation"]["passed"] else "failed",
              "implementation":"not_run",
              "analysis_grid":{"existing_RF_F003_regions":28,"points_per_segment":1001,
                               "additional_RF_T006_points_per_setting":3001,
                               "total_additional_stopband_points":18006},
              "independent_grid":{"method":"explicit coupled-inductor 9x9 branch-current MNA",
                                  "probe_points":r["independent_validation"]["points"]}}
          relative="experiments/chatgpt_topology_search/runs/EXP-048/selected.json"
          manifest["evidence"]=[{"path":relative,"sha256":hashlib.sha256(selected.read_bytes()).hexdigest()}]
          manifest["limitations"]=[
              "Selected local best-found, not global numerical convergence or continuous-frequency guarantee.",
              "No individual part Q(f), SRF, PCB/IC parasitics, EM, tolerances, yield, or measurements.",
              "Independent 9x9 MNA checked 114 probes only; complete 46,034-point finite sweep used reduced nodal model.",
              "30dB harmonic and 20dB wideband are mandatory; nominal ≤0.30dB insertion loss and 35dB harmonics are independent goals."]
          validate_manifest(manifest,root=root)
          write_manifest(dir/"manifest.json",manifest,root=root)
          print("EXP-048 manifest verified, selected_sha256",manifest["evidence"][0]["sha256"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/chatgpt_topology_search/runs/EXP-048/selected.json experiments/chatgpt_topology_search/runs/EXP-048/manifest.json
          git commit -m "results(EXP-048): preserve selected RF-T006 4L 2Cv numerical checkpoint"
          git push origin HEAD:refs/heads/experiment/exp048-rft006-4l2cv-a5p333
