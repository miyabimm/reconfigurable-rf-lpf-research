name: Phase 2 W4 EXP-042 historical variant source recovery

on:
  pull_request:
    paths:
      - 'scripts/audit_w4_exp042_missing_variants.py'
      - '.github/workflows/phase2_w4_exp042_missing_variants.yml'
      - 'data/repository_reviews/w4_exp042_recovered_original_members_20261018/**'
      - 'data/repository_reviews/w4_exp042_missing_variant_source_review_20261018.json'
      - 'docs/phase2_w4_exp042_missing_variant_recovery_20261018.md'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-preserved-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract 3 originally uncurated EXP-042 variants and classify saved numeric records
        run: |
          if test -f data/repository_reviews/w4_exp042_missing_variant_source_review_20261018.json; then
            python3 scripts/audit_w4_exp042_missing_variants.py \
              --output-dir artifacts/phase2_reports/w4/missing_variants \
              --verify-committed-recovery
          else
            python3 scripts/audit_w4_exp042_missing_variants.py \
              --output-dir artifacts/phase2_reports/w4/missing_variants \
              --emit-original-chunks
          fi
      - name: Confirm all ten original archive ZIPs still validate offline
        run: python3 scripts/preserve_exp042_actions_artifacts.py --verify-repository
      - name: Check local Markdown links
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-w4-exp042-recovered-original-source-members
          path: artifacts/phase2_reports/w4/missing_variants/
          retention-days: 30
          if-no-files-found: warn
