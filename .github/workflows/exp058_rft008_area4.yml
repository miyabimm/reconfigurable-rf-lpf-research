name: EXP-058 RF-T008 v3 area4 four L zero GJM
on:
  pull_request:
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-058/**'
      - '.github/workflows/exp058_rft008_area4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  area4:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        remove: [cf0, cf1, cf2, cp]
        variant: [shunt_output, shunt_input, input_output]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Confirm Phase2 EXP-058 and Git-only evidence preflight
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-058 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py preflight EXP-058
      - name: RF-T008 4L no-GJM search
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-058/sweep_area4.py \
            --remove ${{ matrix.remove }} --variant ${{ matrix.variant }} \
            --starts 2 --coarse 7 --fine 17 --dense 1001 --target 30.005 \
            --out results/EXP-058/fourl_${{ matrix.remove }}_${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp058-a4-${{ matrix.remove }}-${{ matrix.variant }}
          path: results/EXP-058/fourl_${{ matrix.remove }}_${{ matrix.variant }}.json
          if-no-files-found: warn
          retention-days: 30
