name: EXP-054 RF-T007 4L combined C DTC connection sweep

on:
  pull_request:
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-054/**'
      - 'tests/test_exp054_combined_edges.py'
      - '.github/workflows/exp054_rft007_4l_combined_c_dtc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp054-4l-combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify main EXP-054 reservation and pre-run Git-only audit
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-054 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py audit
      - name: Validate 20 multi-branch electrical graphs and source reproduction
        run: uv run --frozen python -m unittest discover -s tests -p 'test_exp054_combined_edges.py' -v
      - name: Optimize 4L simultaneous GJM PCB and DTC bridge edges
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-054/sweep_4l_combined_c_dtc.py \
            --starts 2 --maxiter 160 --coarse 7 --fine 17 \
            --dense 1001 --mna 3 --target 30.005 \
            --out results/EXP-054/combined_C_DTC_graphs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp054-rft007-4l-combined-C-DTC
          path: results/EXP-054/combined_C_DTC_graphs.json
          if-no-files-found: warn
          retention-days: 30
