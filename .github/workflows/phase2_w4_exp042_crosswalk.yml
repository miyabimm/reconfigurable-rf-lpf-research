name: Phase 2 W4 EXP-042 artifact-checkpoint crosswalk

on:
  pull_request:
    paths:
      - 'scripts/audit_w4_exp042_artifact_checkpoint_crosswalk.py'
      - '.github/workflows/phase2_w4_exp042_crosswalk.yml'
      - 'docs/phase2_w4_exp042_artifact_checkpoint_crosswalk_20261018.md'
      - 'data/repository_reviews/w4_exp042_member_crosswalk_20261018.csv'
      - 'data/repository_reviews/w4_exp042_crosswalk_summary_20261018.json'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosswalk-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare 19 original ZIP members and curated Git checkpoints by bytes, vector and finite-grid metrics
        run: |
          python3 scripts/audit_w4_exp042_artifact_checkpoint_crosswalk.py \
            --output-dir artifacts/phase2_reports/w4/crosswalk \
            --emit-csv-chunks
      - name: Offline SHA/CRC validation of the original 10 archived ZIPs
        run: python3 scripts/preserve_exp042_actions_artifacts.py --verify-repository
      - name: Verify fixed record against computed crosswalk when available
        run: |
          if test -f data/repository_reviews/w4_exp042_member_crosswalk_20261018.csv; then
            cmp artifacts/phase2_reports/w4/crosswalk/exp042_zip_member_to_git_crosswalk.csv \
              data/repository_reviews/w4_exp042_member_crosswalk_20261018.csv
            python3 - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('data/repository_reviews/w4_exp042_crosswalk_summary_20261018.json').read_text())
          actual=json.loads(Path('artifacts/phase2_reports/w4/crosswalk/exp042_crosswalk_summary.json').read_text())
          assert expected==actual
          assert actual['original_zip_count']==10 and actual['member_count']==19
          assert actual['files_deleted']==0 and actual['rf_optimization_runs']==0
          print('W4 snapshot MATCH: archived source bytes, measured vector/metrics comparisons unchanged')
          PY
          else
            echo 'Initial discovery run: no frozen crosswalk committed yet, review CI artifact before pinning.'
          fi
      - name: Check all tracked Markdown links
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-w4-exp042-source-crosswalk
          path: artifacts/phase2_reports/w4/crosswalk/
          if-no-files-found: warn
          retention-days: 30
