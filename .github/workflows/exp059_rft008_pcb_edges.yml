name: EXP-059 RF-T008 4L1GJM PCB C relocation
# Initial 46-variant study already executed on PR; manual reruns only.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        layout: [control, n3g_for_b12, n3g_for_b03, n4out_for_b12, n4out_for_b03, n3g_and_n4out, n3g_no_n4g, n4out_no_n4g, n3g_n4out_no_n4g, n3g_n4out_keep_b12, n3out_for_b12, n3out_for_b03, n4in_for_b12, n3n4_for_b12, n1g_for_b12, outg_for_b12, inout_for_b12, n4out_n3out, n4in_n3g, n3g_n4out_2pcb, n4g_n3g_2pcb, n4g_n4out_2pcb, n4g_only_1pcb]
        variant: [input_output, shunt_output]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify main EXP-059 reservation and Phase2 preservation policy
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv sync --frozen
          uv run --frozen python scripts/experiment_id_registry.py --experiment-id EXP-059 --owner MasayaTakagi
          uv run --frozen python scripts/audit_new_experiment_storage.py preflight EXP-059
      - name: Optimize fixed PCB connection layout and verify explicit MNA
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-059/search_pcb_edges.py \
            --layout ${{ matrix.layout }} --variant ${{ matrix.variant }} \
            --starts 2 --coarse 7 --fine 17 --dense 1001 --target 30.005 \
            --out results/EXP-059/${{ matrix.layout }}_${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp059-${{ matrix.layout }}-${{ matrix.variant }}
          path: results/EXP-059/${{ matrix.layout }}_${{ matrix.variant }}.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: [sweep]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exp059-*
          merge-multiple: true
          path: results/EXP-059/collected
      - name: Summarize all 46 variants and rank compliant converged alternatives
        shell: bash
        run: |
          python - <<'PY'
          import glob, json
          from pathlib import Path
          files=sorted(glob.glob("results/EXP-059/collected/*.json"))
          rows=[]
          for f in files:
              obj=json.loads(Path(f).read_text())
              best=obj["best_converged_30db"]
              any30=obj["best_any_30db"]
              rows.append({
                  "layout":obj["layout"],"variant":obj["variable_C_edges"],
                  "variable_kind":Path(f).stem.rsplit("_",1)[-1],
                  "filename":Path(f).name,
                  "pcb_edges":obj["fixed_C_edges"][1:],
                  "pcb_count":obj["pcb_installed_count"],
                  "best_il_db":best["dense"]["worst_IL_db"] if best else None,
                  "min_H2_db":best["dense"]["min_H2_db"] if best else None,
                  "min_H3_db":best["dense"]["min_H3_db"] if best else None,
                  "solver_converged_30db":sum(x["eligible_converged"] for x in obj["runs"]),
                  "attempts":len(obj["runs"]),
                  "best_converged_vector":best["vector"] if best else None,
                  "independent_MNA":obj["independent_MNA"],
                  "any_30db_il":any30["dense"]["worst_IL_db"] if any30 else None,
              })
          ranked=sorted((q for q in rows if q["best_il_db"] is not None),
                        key=lambda q:q["best_il_db"])
          payload={"experiment_id":"EXP-059","constraint_id":"RF-T008",
                   "scope":"4L1GJM area4p667, 23 PCB layouts, two DTC layouts, 2 starts each",
                   "planned":46,"completed_variants":len(files),
                   "ranked":ranked,"all_results":rows,
                   "baseline_il_db":0.8543674592970051}
          out=Path("results/EXP-059/summary.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+"\n")
          print("TOTAL",len(files),"COMPLIANT_CONVERGED",len(ranked))
          for q in ranked[:12]:
              print("RANK",q["filename"],q["best_il_db"],"PCB",q["pcb_edges"],
                    "MNA",q["independent_MNA"]["pass"])
          if len(files)!=46: raise SystemExit("Expected 46 trial evidence files")
          if any(not q["independent_MNA"]["pass"] for q in ranked):
              raise SystemExit("Independent MNA failure")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp059-aggregate-summary
          path: results/EXP-059/summary.json
          if-no-files-found: warn
          retention-days: 30
