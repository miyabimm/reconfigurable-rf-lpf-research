name: Phase 2 W4 exact EXP-042 Actions artifact preservation

on:
  pull_request:
    paths:
      - 'scripts/preserve_exp042_actions_artifacts.py'
      - '.github/workflows/phase2_w4_preserve_artifacts.yml'
      - 'data/repository_reviews/w4_exp042_actions_original_zip_b64_20261018.json'
      - 'docs/phase2_w4_exp042_artifact_preservation_20261018.md'
      - 'docs/roadmap.md'
  workflow_dispatch:
    inputs:
      recapture_from_github:
        description: 'Optional: query current GitHub ZIP API again (may expire), never change Git records'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore archived exact ZIP bytes offline and check member SHA256 / CRC
        run: python3 scripts/preserve_exp042_actions_artifacts.py --verify-repository
      - name: Optional freshness check against current GitHub artifact API
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recapture_from_github }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/preserve_exp042_actions_artifacts.py --capture
      - name: Validate tracked Markdown local links
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
